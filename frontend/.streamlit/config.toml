# MindHive theme — "Nova" style: dark with a violet accent.
[theme]
base                    = "dark"
primaryColor            = "#7C5CFF"   # violet — primary action / progress / active
backgroundColor         = "#0A0A14"   # near-black app background
secondaryBackgroundColor= "#14141F"   # cards, sidebar, inputs
textColor               = "#ECECF6"   # soft ink
font                    = "sans serif"

[server]
# Streamlit defaults to 8501; change here if that port is taken.
headless = true
